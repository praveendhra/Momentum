name: iOS build → TestFlight

# Builds the Capacitor iOS app on a GitHub macOS runner and uploads it to
# App Store Connect (TestFlight). No Mac needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the AuthKey_XXXX.p8 file (Admin role)
# Signing is automatic: Xcode uses the API key to create/download the
# distribution certificate and provisioning profile on the fly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in the App Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      check_only:
        description: "Only check that it compiles (unsigned simulator build, no upload, no secrets needed)"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  compile-check:
    if: github.event.inputs.check_only == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web app and sync into iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run ios:sync
      - name: Compile for the iOS simulator (unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild build -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }

  testflight:
    if: github.event.inputs.check_only != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://qcyijvnkgdznekbzccgj.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_HEkrpfICFy5oKMGnSplJ3A_ektg8yry
      VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS || 'google' }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '17185534133-rv5di0vpcakcu82btkfqvg2mdd2d9cq4.apps.googleusercontent.com' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run ios:sync

      - name: Version numbers
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#ios-v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Build number must increase with every upload; the run number does.
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: frontend/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Momentum.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)" || true
          if [ ! -d "$RUNNER_TEMP/Momentum.xcarchive" ]; then
            tail -80 "$RUNNER_TEMP/archive.log"
            # Surface the first errors as annotations so they show on the run page / API.
            grep -E "error:|error -|Error Domain|No profiles|requires a provisioning|Signing for" "$RUNNER_TEMP/archive.log" \
              | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -8 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      - name: Export and upload to App Store Connect
        working-directory: frontend/ios
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Momentum.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            grep -E "error|Error" "$RUNNER_TEMP/export.log" | awk '!seen[$0]++' | head -8 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit "$status"
          fi

      - name: Summary
        run: |
          echo "### Uploaded Momentum ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }}) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
