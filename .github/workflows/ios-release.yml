name: iOS build → TestFlight

# Builds the Capacitor iOS app on a GitHub macOS runner and uploads it to
# App Store Connect (TestFlight). No Mac needed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Full contents of the AuthKey_XXXX.p8 file (Admin role)
# Signing is automatic: Xcode uses the API key to create/download the
# distribution certificate and provisioning profile on the fly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in the App Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      check_only:
        description: "Only check that it compiles (unsigned simulator build, no upload, no secrets needed)"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  compile-check:
    if: github.event.inputs.check_only == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web app and sync into iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run ios:sync
      - name: Compile for the iOS simulator (unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild build -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }

  testflight:
    if: github.event.inputs.check_only != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://qcyijvnkgdznekbzccgj.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_HEkrpfICFy5oKMGnSplJ3A_ektg8yry
      VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS || 'google' }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '17185534133-rv5di0vpcakcu82btkfqvg2mdd2d9cq4.apps.googleusercontent.com' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into iOS project
        working-directory: frontend
        run: |
          npm ci
          npm run ios:sync

      - name: Version numbers
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#ios-v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Build number must increase with every upload; the run number does.
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Sign with a long-lived Apple Distribution certificate. Its private key is
      # the IOS_CERTIFICATE_PRIVATE_KEY secret (the same one Task Tracker uses), so
      # every run reuses the same certificate instead of creating and revoking
      # one. A revoked certificate makes Apple reject the build at review time
      # (ITMS-90035 Invalid Signature).
      - name: Signing certificate and App Store profile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_PRIVATE_KEY }}
        run: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret IOS_CERTIFICATE_PRIVATE_KEY (see docs/app-store.md)."
            exit 1
          fi
          pip3 install --break-system-packages -q codemagic-cli-tools || pip3 install -q codemagic-cli-tools
          keychain initialize
          app-store-connect fetch-signing-files com.praveendhra.momentum \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create 2>&1 | tee "$RUNNER_TEMP/signing.log" || {
              grep -iE "error|fail" "$RUNNER_TEMP/signing.log" | head -8 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              exit 1
            }
          keychain add-certificates
          # Pick the App Store profile for this bundle ID.
          # Codemagic/Xcode keep profiles in one of these, depending on the Xcode version.
          for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            [ -f "$f" ] || continue
            security cms -D -i "$f" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || continue
            appid=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/profile.plist")
            case "$appid" in *.com.praveendhra.momentum) ;; *) continue ;; esac
            plutil -extract ProvisionedDevices raw "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1 && continue
            echo "CI_PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
            echo "::notice::Profile $(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")"
            break
          done
          security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed 's/^/::notice::/'
          if ! grep -q CI_PROFILE_UUID "$GITHUB_ENV"; then
            echo "::error::No App Store profile for com.praveendhra.momentum was downloaded"
            grep -iE "profile" "$RUNNER_TEMP/signing.log" | head -6 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi
          # The profile must carry Sign in with Apple, or the archive fails.
          grep -q "com.apple.developer.applesignin" "$RUNNER_TEMP/profile.plist" \
            || { echo "::error::The App Store profile lacks Sign in with Apple"; exit 1; }

      - name: Archive
        working-directory: frontend/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Momentum.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$CI_PROFILE_UUID" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)" || true
          if [ ! -d "$RUNNER_TEMP/Momentum.xcarchive" ]; then
            tail -80 "$RUNNER_TEMP/archive.log"
            # Surface the first errors as annotations so they show on the run page / API.
            grep -E "error:|error -|Error Domain|No profiles|requires a provisioning|Signing for" "$RUNNER_TEMP/archive.log" \
              | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -8 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      - name: Export App Store build
        working-directory: frontend/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.praveendhra.momentum</key><string>$CI_PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Momentum.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -E "error|Error" "$RUNNER_TEMP/export.log" | awk '!seen[$0]++' | head -8 \
                | while IFS= read -r line; do echo "::error::${line:0:900}"; done
              exit 1
            }
          ls -la "$RUNNER_TEMP/export"

      - name: Check signature and entitlements
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dv "$APP" 2>&1 | grep -E "Authority=|TeamIdentifier" | while read -r l; do echo "::notice::$l"; done
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null)
          echo "$ENT"
          echo "$ENT" | grep -q "com.apple.developer.applesignin" \
            && echo "::notice::Sign in with Apple entitlement present" \
            || { echo "::error::Sign in with Apple entitlement missing from the signed app"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          set -o pipefail
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log" || {
              grep -iE "error|fail" "$RUNNER_TEMP/upload.log" | awk '!seen[$0]++' | head -8 \
                | while IFS= read -r line; do echo "::error::${line:0:900}"; done
              exit 1
            }

      - name: Summary
        run: |
          echo "### Uploaded Momentum ${{ steps.ver.outputs.version }} (build ${{ steps.ver.outputs.build }}) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
